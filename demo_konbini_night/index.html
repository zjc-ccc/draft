<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雨夜便利店 · 街角微缩模型</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080f; }
  #bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 95% at 50% 30%, #23355a 0%, #111c30 42%, #070c15 78%, #04060c 100%);
  }
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(58% 42% at 50% 62%, rgba(86, 138, 235, 0.16), transparent 72%),
      radial-gradient(38% 30% at 22% 18%, rgba(255, 132, 186, 0.07), transparent 70%);
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"><canvas id="c"></canvas></div>
<script src="lib/three.min.js"></script>
<script>
"use strict";

/* ============================================================
   雨夜便利店 · 街角微缩模型
   - 三渲二：MeshToonMaterial 阶梯光栅 + 反向壳描边
   - 底座 12×12，全部元素搭建其上，可拖拽旋转 / 滚轮缩放
   - 无任何 UI 元素；R 键可重播入场组装动画
   ============================================================ */

// ---------------------------------------------------------- 渲染基础
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1322, 0.014);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 260);

// ---------------------------------------------------------- 小工具
const TAU = Math.PI * 2;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const clampN = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutCubic = (k) => 1 - Math.pow(1 - k, 3);
const easeOutBack = (k) => {
  const c1 = 1.35, c3 = c1 + 1;
  return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
};

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
function texFromCanvas(c, repeat) {
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const JP = "'Yu Gothic','YuGothic','Hiragino Kaku Gothic ProN','Meiryo','MS Gothic','Noto Sans JP','Source Han Sans SC',sans-serif";

// ---------------------------------------------------------- 三渲二渐变
const gradSteps = new Uint8Array([46, 108, 176, 232, 255]);
const gradTex = new THREE.DataTexture(gradSteps, gradSteps.length, 1, THREE.RedFormat);
gradTex.minFilter = THREE.NearestFilter;
gradTex.magFilter = THREE.NearestFilter;
gradTex.generateMipmaps = false;
gradTex.needsUpdate = true;

function toon(color, extra) {
  return new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: gradTex }, extra || {}));
}
function basic(color, extra) {
  return new THREE.MeshBasicMaterial(Object.assign({ color: color }, extra || {}));
}

// ---------------------------------------------------------- 描边（反向壳）
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0x080c15) }, uWidth: { value: 0.013 } },
  vertexShader: [
    "uniform float uWidth;",
    "void main(){",
    "  vec3 p = position + normalize(normal) * uWidth;",
    "  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);",
    "}"
  ].join("\n"),
  fragmentShader: [
    "uniform vec3 uColor;",
    "void main(){ gl_FragColor = vec4(uColor, 1.0); }"
  ].join("\n"),
  side: THREE.BackSide
});

function outline(mesh) {
  if (!mesh || !mesh.geometry) return null;
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.position.copy(mesh.position);
  o.rotation.copy(mesh.rotation);
  o.scale.copy(mesh.scale);
  o.renderOrder = -1;
  if (mesh.parent) mesh.parent.add(o);
  return o;
}

// ---------------------------------------------------------- 网格构造快捷方式
function put(parent, geo, mat, x, y, z, rot) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (rot) { m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0); }
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(parent, w, h, d, mat, x, y, z, rot) {
  return put(parent, new THREE.BoxGeometry(w, h, d), mat, x, y, z, rot);
}
function cyl(parent, rt, rb, h, seg, mat, x, y, z, rot) {
  return put(parent, new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, rot);
}
function plane(parent, w, h, mat, x, y, z, rot) {
  const m = put(parent, new THREE.PlaneGeometry(w, h), mat, x, y, z, rot);
  m.castShadow = false;
  return m;
}
function ground(parent, w, d, mat, x, y, z) {
  return put(parent, new THREE.PlaneGeometry(w, d), mat, x, y, z, [-Math.PI / 2, 0, 0]);
}

// ---------------------------------------------------------- 灯光/辉光贴图
const glowTex = (function () {
  const c = makeCanvas(128, 128), g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0.0, "rgba(255,255,255,1)");
  gr.addColorStop(0.25, "rgba(255,255,255,0.55)");
  gr.addColorStop(0.55, "rgba(255,255,255,0.16)");
  gr.addColorStop(1.0, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  return t;
})();

function glow(parent, x, y, z, size, color, opacity) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: color, transparent: true,
    opacity: (opacity === undefined ? 0.55 : opacity),
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  sp.position.set(x, y, z);
  sp.scale.set(size, size, 1);
  parent.add(sp);
  return sp;
}

// 地面光斑
const poolTex = (function () {
  const c = makeCanvas(256, 256), g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0.0, "rgba(255,255,255,0.95)");
  gr.addColorStop(0.35, "rgba(255,255,255,0.42)");
  gr.addColorStop(0.72, "rgba(255,255,255,0.10)");
  gr.addColorStop(1.0, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  return t;
})();

function pool(parent, x, z, w, d, color, opacity, y) {
  const m = plane(parent, w, d, new THREE.MeshBasicMaterial({
    map: poolTex, color: color, transparent: true,
    opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }), x, y === undefined ? 0.02 : y, z, [-Math.PI / 2, 0, 0]);
  m.renderOrder = 3;
  return m;
}

// 湿地拉丝反光
const streakTex = (function () {
  const c = makeCanvas(64, 256), g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0.0, "rgba(255,255,255,0)");
  gr.addColorStop(0.18, "rgba(255,255,255,0.55)");
  gr.addColorStop(0.55, "rgba(255,255,255,0.22)");
  gr.addColorStop(1.0, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
  // 竖向细纹，模拟水面拉丝
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * 64;
    g.fillStyle = "rgba(255,255,255," + (0.05 + Math.random() * 0.1) + ")";
    g.fillRect(x, 20, 1.2, 200);
  }
  const t = new THREE.CanvasTexture(c);
  return t;
})();

function streak(parent, x, z, w, len, ry, color, opacity, y) {
  const g = new THREE.Group();
  g.position.set(x, y === undefined ? 0.012 : y, z);
  g.rotation.y = ry;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), new THREE.MeshBasicMaterial({
    map: streakTex, color: color, transparent: true,
    opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.rotation.x = -Math.PI / 2;
  m.position.z = -len * 0.5;
  m.renderOrder = 2;
  g.add(m);
  parent.add(g);
  return g;
}

// ============================================================
//  贴图：全部用 canvas 画，避免任何外部资源
// ============================================================

// 沥青
const asphaltTex = (function () {
  const c = makeCanvas(512, 512), g = c.getContext("2d");
  g.fillStyle = "#1b2130"; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.6 ? "rgba(90,104,130,0.20)" : "rgba(8,11,18,0.35)";
    g.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  // 裂缝
  g.strokeStyle = "rgba(8,10,16,0.5)"; g.lineWidth = 1.4;
  for (let i = 0; i < 7; i++) {
    g.beginPath();
    let x = Math.random() * 512, y = Math.random() * 512;
    g.moveTo(x, y);
    for (let k = 0; k < 8; k++) {
      x += (Math.random() - 0.5) * 60; y += (Math.random() - 0.5) * 60;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  return texFromCanvas(c, true);
})();
asphaltTex.repeat.set(7, 7);

// 人行道砖
const sidewalkTex = (function () {
  const c = makeCanvas(256, 256), g = c.getContext("2d");
  g.fillStyle = "#5c6476"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = Math.random() > 0.5 ? "rgba(255,255,255,0.05)" : "rgba(28,34,46,0.09)";
    g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  g.strokeStyle = "rgba(30,36,50,0.7)"; g.lineWidth = 2;
  for (let i = 0; i <= 256; i += 64) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
  }
  return texFromCanvas(c, true);
})();
sidewalkTex.repeat.set(6, 6);

// 招牌（正面）
const signFrontTex = (function () {
  const W = 1280, H = 142;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = "#f6f3ea"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#1e4fa3"; g.fillRect(0, 0, W, 9);
  g.fillStyle = "#d93a31"; g.fillRect(0, H - 9, W, 9);
  g.fillStyle = "#16305c";
  g.font = "bold 86px " + JP;
  g.textBaseline = "middle";
  g.fillText("コンビニ", 28, H * 0.52);
  g.strokeStyle = "#d4cfc2"; g.lineWidth = 3;
  g.beginPath(); g.moveTo(492, 20); g.lineTo(492, H - 20); g.stroke();
  g.fillStyle = "#d93a31";
  g.font = "bold 46px " + JP;
  g.fillText("24時間営業", 522, 48);
  g.fillStyle = "#3c4a60";
  g.font = "31px " + JP;
  g.fillText("ATM・コーヒー・ホットスナック", 522, 104);
  return texFromCanvas(c);
})();

// 招牌（侧墙）
const signSideTex = (function () {
  const W = 900, H = 160;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = "#f6f3ea"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#1e4fa3"; g.fillRect(0, 0, W, 10);
  g.fillStyle = "#d93a31"; g.fillRect(0, H - 10, W, 10);
  g.fillStyle = "#16305c"; g.textBaseline = "middle";
  g.font = "bold 80px " + JP;
  g.fillText("コンビニ", 26, 84);
  g.fillStyle = "#d93a31";
  g.font = "bold 62px " + JP;
  g.fillText("営業中", 430, 84);
  g.fillStyle = "#1e4fa3";
  g.font = "bold 44px " + JP;
  g.fillText("24H", 690, 84);
  return texFromCanvas(c);
})();

// 立杆灯箱（竖排）
const pylonTex = (function () {
  const W = 320, H = 900;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = "#f6f3ea"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#1e4fa3"; g.fillRect(0, 0, W, 340);
  g.fillStyle = "#ffffff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "bold 210px " + JP;
  g.fillText("24", W / 2, 150);
  g.font = "bold 44px " + JP;
  g.fillText("HOURS", W / 2, 282);
  g.fillStyle = "#16305c";
  g.font = "bold 128px " + JP;
  const chars = "コンビニ";
  for (let i = 0; i < chars.length; i++) {
    g.fillText(chars[i], W / 2, 420 + i * 122);
  }
  g.fillStyle = "#d93a31"; g.fillRect(0, H - 26, W, 26);
  return texFromCanvas(c);
})();

// 自动贩卖机（红 / 蓝两版）
function vendingTexture(mainColor) {
  const W = 512, H = 1024;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = mainColor; g.fillRect(0, 0, W, H);

  // 上方展示区
  g.fillStyle = "#f2f6fb"; g.fillRect(26, 26, W - 52, 470);
  g.fillStyle = mainColor; g.fillRect(26, 26, W - 52, 52);
  g.fillStyle = "#ffffff"; g.textBaseline = "middle"; g.font = "bold 34px " + JP;
  g.fillText("つめた〜い", 44, 54);

  const cols = 5, rows = 3, cw = (W - 80) / cols;
  for (let r = 0; r < rows; r++) {
    const shelfY = 100 + r * 146;
    g.fillStyle = "rgba(180,196,214,0.55)";
    g.fillRect(32, shelfY + 110, W - 64, 6);
    for (let i = 0; i < cols; i++) {
      const hue = (r * 5 + i) * 37 % 360;
      const x = 40 + i * cw;
      // 瓶身
      g.fillStyle = "hsl(" + hue + ",72%,58%)";
      g.fillRect(x + 10, shelfY + 26, cw - 26, 84);
      // 标签
      g.fillStyle = "rgba(255,255,255,0.82)";
      g.fillRect(x + 10, shelfY + 54, cw - 26, 26);
      // 瓶盖
      g.fillStyle = "hsl(" + hue + ",60%,40%)";
      g.fillRect(x + 18, shelfY + 12, cw - 42, 16);
      // 价格
      g.fillStyle = "#22304a"; g.font = "bold 20px " + JP;
      g.fillText("¥150", x + 14, shelfY + 128);
    }
  }

  // 下方操作面板
  g.fillStyle = "#d9e2ee"; g.fillRect(26, 512, W - 52, 120);
  g.fillStyle = "#2b3648"; g.fillRect(48, 540, 300, 62);
  g.fillStyle = "#8fd0ff"; g.fillRect(60, 550, 276, 42);
  g.fillStyle = "#39465c"; g.fillRect(380, 536, 90, 40);
  g.fillStyle = "#7d8798"; g.fillRect(380, 588, 90, 14);

  // 取货口
  g.fillStyle = "#1a2230"; g.fillRect(60, 680, W - 120, 220);
  g.fillStyle = "#0c111a"; g.fillRect(82, 700, W - 164, 180);
  g.fillStyle = "rgba(160,190,220,0.25)"; g.fillRect(82, 700, W - 164, 10);
  g.fillStyle = "#ffffff"; g.font = "bold 28px " + JP;
  g.fillText("とりだしぐち", 170, 924);
  return texFromCanvas(c);
}
const vendingRedTex = vendingTexture("#cf2d2d");
const vendingBlueTex = vendingTexture("#1f56a8");

// 冷柜门（饮料墙）
const fridgeTex = (function () {
  const W = 1024, H = 440;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = "#f7fbff"; g.fillRect(0, 0, W, H);
  const cols = 4, rows = 5, cw = W / cols;
  for (let r = 0; r < rows; r++) {
    const y = 18 + r * 84;
    g.fillStyle = "rgba(160,182,206,0.45)";
    g.fillRect(6, y + 68, W - 12, 4);
    for (let i = 0; i < cols; i++) {
      const bx = i * cw + 18;
      for (let k = 0; k < 3; k++) {
        const hue = (r * 11 + i * 7 + k * 23) % 360;
        g.fillStyle = "hsl(" + hue + ",70%,57%)";
        g.fillRect(bx + k * 44, y + 14, 30, 54);
        g.fillStyle = "rgba(255,255,255,0.86)";
        g.fillRect(bx + k * 44, y + 34, 30, 16);
      }
    }
  }
  // 门缝
  g.fillStyle = "rgba(52,64,84,0.7)";
  for (let i = 1; i < cols; i++) g.fillRect(i * cw - 3, 0, 6, H);
  g.fillRect(0, 0, W, 6); g.fillRect(0, H - 6, W, 6);
  return texFromCanvas(c);
})();

// 海报 / 公告栏

  g.fillStyle = "#e9e4d6"; g.fillRect(0, 0, W, H);

  g.fillStyle = "#2f6bd8"; g.fillRect(268, 52, 190, 150);
  g.fillStyle = "#eaf2ff"; g.font = "bold 30px " + JP;
  g.fillText("夏祭り", 292, 112);
  g.fillText("8.20", 292, 156);

  g.fillStyle = "#f2f4f7"; g.fillRect(268, 224, 190, 240);
  g.fillStyle = "#495468"; g.font = "bold 26px " + JP;
  g.fillText("求人募集", 292, 272);
  g.fillStyle = "#8b93a2"; g.font = "20px " + JP;
  for (let i = 0; i < 5; i++) g.fillRect(292, 306 + i * 26, 140 - i * 12, 8);

  g.fillStyle = "#f6f3ea"; g.fillRect(52, 330, 190, 134);
  g.fillStyle = "#3f4a5e"; g.font = "bold 24px " + JP;
  g.fillText("本日のおすすめ", 68, 366);
  g.fillStyle = "#d93a31"; g.font = "bold 20px " + JP;
  g.fillText("ホットコーヒー ¥100", 68, 412);
  return texFromCanvas(c);
})();

// 禁止停车 / 止まれ 路牌
const stopTex = (function () {
  const W = 256, H = 256;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#d0342c";
  g.beginPath();
  g.moveTo(128, 232); g.lineTo(16, 40); g.lineTo(240, 40);

})();

// 店内吊牌
function hangSign(text, bg, fg) {
  const W = 512, H = 128;
  const c = makeCanvas(W, H), g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "bold 74px " + JP;
  g.fillText(text, W / 2, H / 2 + 4);
  return texFromCanvas(c);
}
const hangOden = hangSign("おでん", "#fff6dd", "#b8442a");
const hangCoffee = hangSign("COFFEE", "#f7f2e6", "#4a3a28");
const hangATM = hangSign("ATM", "#eef4ff", "#26559c");

// ============================================================
//  场景材质
// ============================================================
const MAT = {
  asphalt: toon(0xffffff, { map: asphaltTex }),
  sidewalk: toon(0xffffff, { map: sidewalkTex }),
  curb: toon(0x5d6578),
  paint: basic(0xd4dce6, { transparent: true, opacity: 0.85 }),
  paintYellow: basic(0xcfae62, { transparent: true, opacity: 0.8 }),
  plinth: toon(0x11161f),
  plinthTrim: toon(0x1b2331),
  wall: toon(0x5b574d),
  wallInner: toon(0x736f64),
  wallDark: toon(0x232b39),
  roof: toon(0x333a4a),
  roofTop: toon(0x272d3b),
  metal: toon(0x4e5666),
  metalDark: toon(0x222a36),
  glass: new THREE.MeshBasicMaterial({
    color: 0x9fd0ff, transparent: true, opacity: 0.045,
    depthWrite: false, side: THREE.DoubleSide
  }),
  glassSheen: new THREE.MeshBasicMaterial({
    color: 0xbfe4ff, transparent: true, opacity: 0.015,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  }),
  floorIn: toon(0xb08f6a),
  shelf: toon(0xc4c8d0),
  shelfFrame: toon(0x9aa0ad),
  counter: toon(0xc8ccd4),
  warmPanel: basic(0xfff3d6),
  coolPanel: basic(0xe8f6ff),
  neonRed: basic(0xff5a5a),
  neonBlue: basic(0x6ec8ff),
  bulb: basic(0xfff0c6),
  stone: toon(0x545c6b),
  concrete: toon(0x2f3644),
  white: toon(0x9c968a),
  signWhite: toon(0xa9a396),
  dark: toon(0x1b2130)

// ============================================================

const animParts = [];
function anim(obj, delay, mode) {
  animParts.push({
    obj: obj,
    delay: delay,
    mode: mode || "pop",
    basePos: obj.position.clone(),
    baseScale: obj.scale.clone()
  });
  obj.visible = false;
  return obj;
}

// ---- 电线（悬链）
function wire(a, b, sag, radius) {
  const mid = V3((a.x + b.x) / 2, (a.y + b.y) / 2 - sag, (a.z + b.z) / 2);
  const q1 = V3(a.x * 0.72 + mid.x * 0.28, (a.y + mid.y) / 2 - sag * 0.25, a.z * 0.72 + mid.z * 0.28);
  const q2 = V3(b.x * 0.72 + mid.x * 0.28, (b.y + mid.y) / 2 - sag * 0.25, b.z * 0.72 + mid.z * 0.28);
  const curve = new THREE.CatmullRomCurve3([a, q1, mid, q2, b]);
  const geo = new THREE.TubeGeometry(curve, 26, radius, 5, false);
  const m = new THREE.Mesh(geo, toon(0x161b24));
  m.castShadow = false;
  gProps.add(m);
  return m;
}

    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  rainGroup.add(lines);
  rainGroup.userData.lines = lines;
})();

// ============================================================
//  8. 灯光
// ============================================================
(function buildLights() {
  const hemi = new THREE.HemisphereLight(0x4f6c9c, 0x101620, 0.22);
  scene.add(hemi);

  const moon = new THREE.DirectionalLight(0x9db9ff, 0.42);
  moon.position.set(-9, 15, 8);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -9;
  moon.shadow.camera.right = 9;
  moon.shadow.camera.top = 9;
  moon.shadow.camera.bottom = -9;
  moon.shadow.camera.near = 1;
  moon.shadow.camera.far = 48;
  moon.shadow.bias = -0.0009;
  moon.shadow.normalBias = 0.025;
  scene.add(moon);

  // 背面冷色轮廓光
  const rim = new THREE.DirectionalLight(0x5f9dff, 0.34);
  rim.position.set(7, 6, -9);
  scene.add(rim);

  // 霓虹补光（粉）
  const neon = new THREE.PointLight(0xff6fae, 0.55, 13, 2.0);
  neon.position.set(-4.5, 4.2, 2.0);
  scene.add(neon);
})();

// ============================================================
//  9. 入场组装动画时间轴
// ============================================================
function buildTimeline() {
  animParts.length = 0;
  anim(gBase, 0.02, "rise");
  anim(gStreet, 0.42, "rise");
  anim(gShell, 0.95, "rise");
  anim(gSign, 1.55, "rise");
  anim(gGlass, 1.85, "pop");
  anim(gInner, 1.35, "pop");
  anim(gProps, 2.35, "pop");
  anim(gWet, 3.05, "pop");
  anim(rainGroup, 3.55, "pop");

  // 道具逐个入场（gProps 内部单独登记会有叠加问题，这里用整体时间错开）
  let d = 2.35;
  for (let i = 0; i < gProps.children.length; i++) {
    const c = gProps.children[i];
    if (c.userData.noAnim) continue;
    anim(c, d, "pop");
    d += 0.075;
  }
  // 合并：整体 prop 组用更早的时间点
  const gp = animParts.find(function (p) { return p.obj === gProps; });
  if (gp) gp.delay = 2.2;
}
buildTimeline();

let startTime = performance.now() / 1000;
let animDone = false;

function resetAnimation() {
  startTime = performance.now() / 1000;
  animDone = false;
  for (let i = 0; i < animParts.length; i++) {
    const p = animParts[i];
    p.obj.visible = false;
    p.obj.position.copy(p.basePos);
    p.obj.scale.copy(p.baseScale);
  }
}

// ============================================================
// 10. 相机控制（拖拽旋转 / 滚轮缩放 / 双指捏合）
// ============================================================
const view = {
  yaw: 0.68,
  pitch: 0.47,
  dist: 22.6,
  target: V3(0, 1.25, 0)
};

function updateCamera() {
  const cp = Math.cos(view.pitch);
  camera.position.set(
    view.target.x + Math.sin(view.yaw) * cp * view.dist,
    view.target.y + Math.sin(view.pitch) * view.dist,
    view.target.z + Math.cos(view.yaw) * cp * view.dist
  );
  camera.lookAt(view.target);
}
updateCamera();

const pointers = new Map();
let lastInput = performance.now();
let pinchStart = 0;

canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastInput = performance.now();
  if (pointers.size === 2) {
    const it = pointers.values();
    const a = it.next().value, b = it.next().value;
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

canvas.addEventListener("pointermove", function (e) {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x;
  const dy = e.clientY - prev.y;
  prev.x = e.clientX;
  prev.y = e.clientY;
  lastInput = performance.now();

  if (pointers.size >= 2) {
    const it = pointers.values();
    const a = it.next().value, b = it.next().value;
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchStart > 0) {
      view.dist = clampN(view.dist * (pinchStart / Math.max(d, 1)), 9, 52);
      updateCamera();
    }
    pinchStart = d;
    return;
  }

  view.yaw -= dx * 0.0062;
  view.pitch = clampN(view.pitch + dy * 0.0048, 0.1, 1.36);
  updateCamera();
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", endPointer);

canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.08 : 0.925;
  view.dist = clampN(view.dist * k, 9, 52);
  updateCamera();
  lastInput = performance.now();
}, { passive: false });

window.addEventListener("keydown", function (e) {
  if (e.key === "r" || e.key === "R") resetAnimation();
});

window.addEventListener("resize", function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

// ============================================================
// 11. 主循环
// ============================================================
const tmpColor = new THREE.Color();

function tick() {
  requestAnimationFrame(tick);
  const now = performance.now();
  const t = now / 1000;
  const elapsed = t - startTime;

  // --- 组装动画
  for (let i = 0; i < animParts.length; i++) {
    const p = animParts[i];
    const local = elapsed - p.delay;
    if (local <= 0) {
      p.obj.visible = false;
      continue;
    }
    p.obj.visible = true;
    const dur = p.mode === "rise" ? 0.75 : 0.62;
    const k = Math.min(1, local / dur);
    const e = easeOutBack(k);
    if (p.mode === "rise") {
      p.obj.position.y = p.basePos.y - (1 - easeOutCubic(k)) * 0.55;
      p.obj.scale.copy(p.baseScale);
    } else {
      const s = 0.55 + 0.45 * e;
      p.obj.scale.set(p.baseScale.x * s, p.baseScale.y * s, p.baseScale.z * s);
      p.obj.position.y = p.basePos.y + (1 - easeOutCubic(k)) * 0.35;
    }
  }
  if (!animDone && elapsed > 5.2) animDone = true;

  // --- 相机闲置自动巡游
  if (now - lastInput > 4200 && pointers.size === 0) {
    view.yaw += 0.0011;
    updateCamera();
  }

  // --- 雨
  const lines = rainGroup.userData.lines;
  if (lines) {
    const arr = lines.geometry.attributes.position.array;
    for (let i = 0; i < RAIN_N; i++) {
      const d = rainData[i];
      d.y -= d.sp * 0.016;
      d.x -= 0.9 * 0.016;
      if (d.y < 0) {
        d.y = 9.5;
        d.x = (Math.random() - 0.5) * 11.6;
        d.z = (Math.random() - 0.5) * 11.6;
      }
      const o = i * 6;
      arr[o] = d.x; arr[o + 1] = d.y; arr[o + 2] = d.z;
      arr[o + 3] = d.x + 0.055; arr[o + 4] = d.y + d.len; arr[o + 5] = d.z;
    }
    lines.geometry.attributes.position.needsUpdate = true;
  }

  // --- 积水涟漪
  for (let i = 0; i < ripples.length; i++) {
    const r = ripples[i];
    let ph = (t * 0.55 + r.phase) % 1.6;
    ph = ph / 1.6;
    const s = 0.06 + ph * r.anchor;
    r.mesh.scale.set(s * r.rx, s * r.rz, 1);
    r.mesh.material.opacity = (1 - ph) * 0.10;
    r.mesh.position.x = r.cx + Math.sin(r.phase * 12.3) * r.rx * 0.3;
    r.mesh.position.z = r.cz + Math.cos(r.phase * 9.1) * r.rz * 0.25;
  }

  renderer.render(scene, camera);
}
tick();
</script>
